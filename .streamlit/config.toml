# This version is a local browser app; do not expose the model server to a LAN.
[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#B80C09"
backgroundColor = "#E5E7E6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B2420"
linkColor = "#B80C09"
borderColor = "#B7B5B3"

[theme.sidebar]
primaryColor = "#B80C09"
backgroundColor = "#B7B5B3"
secondaryBackgroundColor = "#E5E7E6"
textColor = "#6B2B06"
borderColor = "#6B2B06"
